# Fly.io application configuration for the NucleiAI backend
# Deploy with: fly deploy  (from web-programming/ directory)
# First-time setup: fly launch --no-deploy  (then set secrets, then fly deploy)

app = "nuclei-ai-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  PORT = "8000"

# Secrets (set via `fly secrets set KEY=value`, never committed):
#   SECRET_KEY
#   DATABASE_URL          (Fly Postgres connection string)
#   FRONTEND_URL          (https://<your-pages-project>.pages.dev)
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
#   GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET
#   DISCORD_CLIENT_ID / DISCORD_CLIENT_SECRET
#   SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASSWORD

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Persistent volume for uploaded images and analysis results
[[mounts]]
  source = "nuclei_storage"
  destination = "/app/backend/storage"
  initial_size = "1gb"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"
